<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <!-- Students will build the semantic structure here -->

    <!-- Header section - students will add -->
    <header>
    <h1>Matthew Liang</h1>
    <p class="tagline">Software Engineer</p>
    </header>

    <nav>
        <ul>
            <li><a href="#about">About</a></li>
            <li><a href="#skills">Skills</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section id="about">
            <h2>About Me</h2>
            <p>I am a senior at UC Berkeley.</p>
            <p>I am interested in web development and software engineering.</p>
        </section>

        <section id="skills">
            <h2>Skills & Interests</h2>
            <ul class="skills-list">
                <li>HTML5 & Semantic Markup</li>
                <li>CSS3 & Responsive Design</li>
                <li>Cooking</li>
            </ul>
        </section>

        <section id="contact">
            <form action="#" method="post" class="contact-form">
            <div class="form-group">
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="form-group">
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject">
            </div>
            
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            
            <button type="submit">Send Message</button>
        </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Matthew Liang</p>
    </footer>
